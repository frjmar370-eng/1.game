name: Build Shotgun 3D City APK

on:
  workflow_dispatch:

concurrency:
  group: shotgun3d-android-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android City Test
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify city source
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/Scenes/Main.unity
          test -f Assets/Scripts/SceneBootstrap.cs
          test -f Assets/Scripts/CityTestMap.cs
          grep -q "CITY TEST MAP" Assets/Scripts/SceneBootstrap.cs
          grep -q "MobileHUD.Build" Assets/Scripts/SceneBootstrap.cs
          grep -q "BuildBuildings" Assets/Scripts/CityTestMap.cs
          grep -q "BuildRoadNetwork" Assets/Scripts/CityTestMap.cs
          grep -q "BuildPlayerStart" Assets/Scripts/CityTestMap.cs
          grep -q "Assets/Scenes/Main.unity" ProjectSettings/EditorBuildSettings.asset
          grep -q "AndroidTargetArchitectures: 2" ProjectSettings/ProjectSettings.asset
          grep -q "ForceInternetPermission: 1" ProjectSettings/ProjectSettings.asset

      - name: Stamp build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('Assets/Scripts/BuildStamp.cs')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'public const string Version = "[^"]*";',f'public const string Version = "CITY BUILD {os.environ["GITHUB_SHA"][:12]}";',s)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Cache Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Library
          key: Library-Android-City-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-City-

      - name: Build APK
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.62f2
          projectPath: .
          buildMethod: ShotgunAndroidBuild.BuildAPK
          allowDirtyBuild: true
          customParameters: -quit -nographics -batchmode

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s Builds/Shotgun3D.apk
          test "$(stat -c%s Builds/Shotgun3D.apk)" -gt 5000000
          ls -lh Builds/Shotgun3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Shotgun3D-City-APK
          path: Builds/Shotgun3D.apk
          if-no-files-found: error
