name: Build Shotgun 3D APK

on:
  workflow_dispatch:

concurrency:
  group: shotgun3d-android-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Unity Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      # GameCI runs Unity from a prepared Docker image instead of installing
      # Unity Hub on the GitHub runner. This avoids the /opt/unityhub/unityhub
      # installation failure seen with the previous Buildalon setup step.
      # Unity Personal still needs a one-time UNITY_LICENSE (.ulf) secret.
      - name: Build Unity project
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.62f2
          projectPath: .
          buildMethod: ShotgunAndroidBuild.BuildAPK
          allowDirtyBuild: true
          customParameters: -quit -nographics -batchmode

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s Builds/Shotgun3D.apk
          ls -lh Builds/Shotgun3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Shotgun3D-APK
          path: Builds/Shotgun3D.apk
          if-no-files-found: error
