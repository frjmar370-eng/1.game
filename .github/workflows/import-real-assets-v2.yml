name: Import real 3D assets v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Stop bot loop
        if: github.actor == 'github-actions[bot]'
        run: exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified CC0 Quaternius pack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/freemodels
          git clone --depth 1 https://github.com/agentkaerf/FreeModels.git /tmp/freemodels
          test -d "/tmp/freemodels/Sci-Fi Essentials Kit[Standard]/glTF"

      - name: Install real models into Unity Resources
        shell: bash
        run: |
          set -euo pipefail
          SRC="/tmp/freemodels/Sci-Fi Essentials Kit[Standard]/glTF"
          DST="Assets/Resources/RealPacks/SciFiEssentials"
          rm -rf "$DST"
          mkdir -p "$DST"
          cp -f "$SRC"/*.gltf "$DST"/
          cp -f "$SRC"/*.bin "$DST"/
          cp -f "$SRC"/*.png "$DST"/

          cat > Assets/Resources/RealPacks/REAL_ASSETS.md <<'EOF'
# Real 3D assets

Source: Quaternius Sci-Fi Essentials Kit (Standard) mirrored by agentkaerf/FreeModels.
License: CC0 1.0 Universal.

Included real assets:
- Animated robot/enemy models
- Multiple guns
- Crates, barrels, health/ammo props
- Textures and binary geometry buffers

The Unity project uses glTFast 6.17.0 for glTF import.
EOF

          rm -f Assets/Art/Models/Player/Player.glb
          rm -f Assets/Art/Models/Weapons/Shotgun.glb
          rm -f Assets/Art/Models/Environment/Crate.glb
          rm -f Assets/Art/Models/Environment/Barrel.glb

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Resources/RealPacks Assets/Art/Models
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import real CC0 Quaternius 3D assets'
          git push
