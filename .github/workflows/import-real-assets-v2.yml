name: Import real 3D assets v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Stop bot loop
        if: github.actor == 'github-actions[bot]'
        run: exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CC0 asset packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets
          curl -L --fail --retry 3 -o /tmp/assets/scifi.zip https://opengameart.org/sites/default/files/sci-fi_essentials_kit_models.zip
          curl -L --fail --retry 3 -o /tmp/assets/blaster.zip https://kenney.nl/media/pages/assets/blaster-kit/261d80a716-1753959510/kenney_blaster-kit_2.1.zip
          curl -L --fail --retry 3 -o /tmp/assets/survival.zip https://kenney.nl/media/pages/assets/survival-kit/4065a8185b-1712149243/kenney_survival-kit.zip
          curl -L --fail --retry 3 -o /tmp/assets/nature.zip https://kenney.nl/media/pages/assets/nature-kit/37ac38a37b-1677698939/kenney_nature-kit.zip

      - name: Install real GLB files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted/scifi /tmp/extracted/blaster /tmp/extracted/survival /tmp/extracted/nature
          unzip -q /tmp/assets/scifi.zip -d /tmp/extracted/scifi
          unzip -q /tmp/assets/blaster.zip -d /tmp/extracted/blaster
          unzip -q /tmp/assets/survival.zip -d /tmp/extracted/survival
          unzip -q /tmp/assets/nature.zip -d /tmp/extracted/nature

          rm -rf Assets/Art/Models/RealPacks
          mkdir -p Assets/Art/Models/RealPacks/SciFiEssentials
          mkdir -p Assets/Art/Models/RealPacks/KenneyBlaster
          mkdir -p Assets/Art/Models/RealPacks/KenneySurvival
          mkdir -p Assets/Art/Models/RealPacks/KenneyNature

          find /tmp/extracted/scifi -type f -iname '*.glb' -exec cp -f {} Assets/Art/Models/RealPacks/SciFiEssentials/ \;
          find /tmp/extracted/blaster -type f -iname '*.glb' -exec cp -f {} Assets/Art/Models/RealPacks/KenneyBlaster/ \;
          find /tmp/extracted/survival -type f -iname '*.glb' -exec cp -f {} Assets/Art/Models/RealPacks/KenneySurvival/ \;
          find /tmp/extracted/nature -type f -iname '*.glb' -exec cp -f {} Assets/Art/Models/RealPacks/KenneyNature/ \;

          cat > Assets/Art/Models/REAL_ASSETS.md <<'EOF'
# Real 3D asset packs

All imported model sources are real GLB/glTF assets and are CC0 licensed.

Sources:
- Quaternius Sci-Fi Essentials Kit — OpenGameArt model archive.
- Kenney Blaster Kit 2.1 — official Kenney archive.
- Kenney Survival Kit — official Kenney archive.
- Kenney Nature Kit — official Kenney archive.
EOF

          rm -f Assets/Art/Models/Player/Player.glb
          rm -f Assets/Art/Models/Weapons/Shotgun.glb
          rm -f Assets/Art/Models/Environment/Crate.glb
          rm -f Assets/Art/Models/Environment/Barrel.glb

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Art/Models
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import real CC0 GLB asset packs'
          git push
