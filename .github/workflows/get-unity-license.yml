name: Get Unity License Request

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation:
    name: Generate Unity activation request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate activation request file
        id: activation
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: unity-license-request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
